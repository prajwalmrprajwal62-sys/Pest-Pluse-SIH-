services:
  - type: web
    name: pestpulse
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DEMO_MODE
        value: "true"
      - key: OPEN_METEO_ENABLED
        value: "true"
      - key: GRADIO_URL
        value: ""
    disk:
      name: pestpulse-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
